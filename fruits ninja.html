<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Educational Fruit Ninja</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 1px solid #fff; }
        #startScreen, #gameOverScreen { 
            position: absolute; 
            background: rgba(0, 0, 0, 0.7); 
            color: white; 
            font-family: Arial, sans-serif; 
            font-size: 40px; 
            text-align: center; 
            width: 800px; 
            height: 600px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        #gameOverScreen { display: none; }
        #startButton, #restartButton { 
            margin-top: 20px; 
            font-size: 20px; 
            padding: 10px 20px; 
            cursor: pointer; 
            background: #4CAF50; 
            border: none; 
            color: white; 
            border-radius: 5px; 
        }
        #formulasList { 
            font-size: 20px; 
            margin-top: 20px; 
            max-height: 300px; 
            overflow-y: auto; 
            text-align: left; 
            padding: 0 20px; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="startScreen">
        <div>Don't lift your hand once the game starts!</div>
        <button id="startButton">Start Game</button>
    </div>
    <div id="gameOverScreen">
        <div>Game Over!</div>
        <div style="font-size: 24px;">Score: <span id="finalScore">0</span></div>
        <div id="formulasList"></div>
        <button id="restartButton">Restart</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const finalScore = document.getElementById('finalScore');
        const formulasList = document.getElementById('formulasList');

        // Game variables
        let fruits = [];
        let isSlicing = false;
        let slicePath = [];
        let score = 0;
        let gameOver = false;
        let gameStarted = false;
        let formulaDisplay = null;
        let formulaTimer = 0;
        let earnedFormulas = [];
        let availableFormulas = [
            "F = m * a (Newton's Second Law)",
            "E = m * c² (Mass-Energy Equivalence)",
            "v = u + a * t (Kinematics Equation)",
            "p = m * v (Momentum)",
            "KE = (1/2) * m * v² (Kinetic Energy)",
            "H₂O (Water)",
            "PV = nRT (Ideal Gas Law)",
            "E = hc/λ (Planck's Equation)",
            "pH = -log[H⁺] (pH Definition)",
            "ΔG = ΔH - TΔS (Gibbs Free Energy)"
        ];

        // Fruit class
        class Fruit {
            constructor(x, y, vx, vy, radius, color, shape) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
                this.shape = shape; // 'apple', 'mango', 'banana'
                this.gravity = 0.2;
                this.cut = false;
            }

            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                if (this.y > canvas.height + this.radius && !this.cut) {
                    gameOver = true;
                }
            }

            draw() {
                ctx.beginPath();
                if (this.shape === 'apple') {
                    // Apple: Rounded with a slight top indent
                    ctx.arc(this.x, this.y, this.radius, 0.2 * Math.PI, 1.8 * Math.PI);
                    ctx.bezierCurveTo(
                        this.x - this.radius * 0.8, this.y - this.radius * 1.2,
                        this.x + this.radius * 0.8, this.y - this.radius * 1.2,
                        this.x + this.radius, this.y
                    );
                } else if (this.shape === 'mango') {
                    // Mango: Oval with a tapered end
                    ctx.ellipse(this.x, this.y, this.radius * 1.2, this.radius * 0.8, 0, 0, Math.PI * 2);
                    ctx.moveTo(this.x + this.radius * 1.2, this.y);
                    ctx.lineTo(this.x + this.radius * 1.5, this.y - this.radius * 0.3);
                } else if (this.shape === 'banana') {
                    // Banana: Curved elongated shape
                    ctx.moveTo(this.x - this.radius, this.y + this.radius);
                    ctx.quadraticCurveTo(
                        this.x, this.y - this.radius * 1.5,
                        this.x + this.radius, this.y + this.radius
                    );
                    ctx.quadraticCurveTo(
                        this.x, this.y + this.radius * 0.5,
                        this.x - this.radius, this.y + this.radius
                    );
                }
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Spawn fruits
        function spawnFruit() {
            if (!gameStarted || gameOver) return;
            const x = Math.random() * (canvas.width - 100) + 50;
            const y = canvas.height;
            const vx = (Math.random() - 0.5) * 6;
            const vy = -(10 + Math.random() * 5);
            const radius = 20 + Math.random() * 10;
            const colors = ['red', 'green', 'yellow', 'orange', 'purple'];
            const shapes = ['apple', 'mango', 'banana'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            fruits.push(new Fruit(x, y, vx, vy, radius, color, shape));
        }

        setInterval(spawnFruit, 1000);

        // Get mouse/touch position relative to canvas
        function getMousePos(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (event.clientX - rect.left) * scaleX,
                y: (event.clientY - rect.top) * scaleY
            };
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            if (!gameStarted || gameOver) return;
            e.preventDefault();
            isSlicing = true;
            const pos = getMousePos(e);
            if (pos.x >= 0 && pos.x <= canvas.width && pos.y >= 0 && pos.y <= canvas.height) {
                slicePath = [pos];
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!gameStarted || gameOver || !isSlicing) return;
            e.preventDefault();
            const pos = getMousePos(e);
            if (pos.x >= 0 && pos.x <= canvas.width && pos.y >= 0 && pos.y <= canvas.height) {
                slicePath.push(pos);
                checkSlices();
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (!gameStarted || gameOver) return;
            isSlicing = false;
            slicePath = [];
            gameOver = true;
        });

        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            if (!gameStarted || gameOver) return;
            e.preventDefault();
            const touch = e.touches[0];
            isSlicing = true;
            const pos = getMousePos(touch);
            if (pos.x >= 0 && pos.x <= canvas.width && pos.y >= 0 && pos.y <= canvas.height) {
                slicePath = [pos];
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!gameStarted || gameOver || !isSlicing) return;
            e.preventDefault();
            const touch = e.touches[0];
            const pos = getMousePos(touch);
            if (pos.x >= 0 && pos.x <= canvas.width && pos.y >= 0 && pos.y <= canvas.height) {
                slicePath.push(pos);
                checkSlices();
            }
        });

        canvas.addEventListener('touchend', () => {
            if (!gameStarted || gameOver) return;
            isSlicing = false;
            slicePath = [];
            gameOver = true;
        });

        // Check if slice intersects fruits
        function checkSlices() {
            let fruitCut = false;
            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                if (fruit.cut) continue;

                for (let j = 1; j < slicePath.length; j++) {
                    const p1 = slicePath[j - 1];
                    const p2 = slicePath[j];

                    // Calculate distance from fruit center to line segment
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const fx = fruit.x - p1.x;
                    const fy = fruit.y - p1.y;

                    const len = Math.sqrt(dx * dx + dy * dy);
                    if (len === 0) continue;

                    const t = Math.max(0, Math.min(1, (fx * dx + fy * dy) / len));
                    const closestX = p1.x + t * dx;
                    const closestY = p1.y + t * dy;

                    const distX = fruit.x - closestX;
                    const distY = fruit.y - closestY;
                    const distance = Math.sqrt(distX * distX + distY * distY);

                    if (distance <= fruit.radius) {
                        fruit.cut = true;
                        score++;
                        showFormula();
                        fruits.splice(i, 1);
                        fruitCut = true;
                        break;
                    }
                }
            }
            if (fruitCut) {
                slicePath = [slicePath[slicePath.length - 1]]; // Keep last point for continuous slicing
            }
        }

        // Show random unique formula
        function showFormula() {
            if (availableFormulas.length === 0) return;
            const index = Math.floor(Math.random() * availableFormulas.length);
            const formula = availableFormulas[index];
            formulaDisplay = formula;
            formulaTimer = 180;
            earnedFormulas.push(formula);
            availableFormulas.splice(index, 1);
        }

        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameStarted && !gameOver) {
                // Update and draw fruits
                fruits.forEach(fruit => {
                    fruit.update();
                    fruit.draw();
                });

                // Draw slice trail
                if (isSlicing && slicePath.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(slicePath[0].x, slicePath[0].y);
                    for (let i = 1; i < slicePath.length; i++) {
                        ctx.lineTo(slicePath[i].x, slicePath[i].y);
                    }
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                // Draw score
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`Score: ${score}`, 10, 30);

                // Draw formula
                if (formulaTimer > 0) {
                    ctx.fillStyle = 'cyan';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(formulaDisplay, canvas.width / 2, canvas.height / 2);
                    formulaTimer--;
                }
            }

            // Handle game over
            if (gameOver) {
                gameOverScreen.style.display = 'flex';
                finalScore.textContent = score;
                formulasList.innerHTML = earnedFormulas.length > 0 
                    ? '<strong>Earned Formulas:</strong><br>' + earnedFormulas.join('<br>')
                    : 'No formulas earned.';
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        // Start game
        startButton.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameStarted = true;
            gameLoop();
        });

        // Restart game
        restartButton.addEventListener('click', () => {
            fruits = [];
            score = 0;
            gameOver = false;
            gameStarted = false;
            formulaDisplay = null;
            formulaTimer = 0;
            earnedFormulas = [];
            availableFormulas = [
                "F = m * a (Newton's Second Law)",
                "E = m * c² (Mass-Energy Equivalence)",
                "v = u + a * t (Kinematics Equation)",
                "p = m * v (Momentum)",
                "KE = (1/2) * m * v² (Kinetic Energy)",
                "H₂O (Water)",
                "PV = nRT (Ideal Gas Law)",
                "E = hc/λ (Planck's Equation)",
                "pH = -log[H⁺] (pH Definition)",
                "ΔG = ΔH - TΔS (Gibbs Free Energy)"
            ];
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        });

        // Initialize
        gameLoop();
    </script>
</body>
</html>
